version: '3.9'

services:
  backend:
    image: task-api:1.0
    container_name: task-api-container
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: task-ui:1.0
    container_name: task-ui-container
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped